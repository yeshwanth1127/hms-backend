# Reference reverse proxy for one server: website (serve, :5567) + API/booking/staff (uvicorn, :8004).
# Copy into /etc/nginx/sites-available/, set server_name and certificates, then `nginx -t && systemctl reload nginx`.

# First line of defence; the app keeps its own per-IP/per-session budgets (app/limits.py).
limit_req_zone $binary_remote_addr zone=hms_api:10m rate=20r/s;

upstream hms_api  { server 127.0.0.1:8004; keepalive 16; }
upstream hms_site { server 127.0.0.1:5567; keepalive 8; }

server {
    listen 80;
    server_name clinic.example;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name clinic.example;
    ssl_certificate     /etc/letsencrypt/live/clinic.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/clinic.example/privkey.pem;

    client_max_body_size 20m;          # largest staff upload; the app caps JSON bodies at 256 KB
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # Overwrite, never append: uvicorn trusts this header from 127.0.0.1 for rate limits and audit IPs.
    # If a CDN sits in front, use its real-IP module instead.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;

    # JSON clients get a JSON outage answer with the reception number.
    location /api/ {
        limit_req zone=hms_api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://hms_api;
        error_page 502 503 504 = @api_down;
    }

    location ~ ^/(book|staff|talk|whatsapp-assets)(/|$) {
        limit_req zone=hms_api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://hms_api;
        error_page 502 503 504 /booking-unavailable.html;
    }

    location / {
        proxy_pass http://hms_site;
        error_page 502 503 504 /booking-unavailable.html;
    }

    # Only nginx's own upstream failures land here; application errors pass through untouched.
    location @api_down {
        default_type application/json;
        add_header Retry-After 30 always;
        return 503 '{"error":{"code":"SERVICE_UNAVAILABLE","message":"Online booking is briefly unavailable. Please call reception on +91 80 4968 2800."}}';
    }

    location = /booking-unavailable.html {
        root /var/www/hms-backend/deploy;
        internal;
        add_header Cache-Control "no-store" always;
        add_header Retry-After 30 always;
    }
}
