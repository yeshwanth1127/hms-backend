name: avocado-health
services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://avocado:avocado@postgres:5432/avocado
      REDIS_URL: redis://redis:6379/0
      ALLOWED_ORIGINS: http://localhost:5567
      ADMIN_API_KEY: ${ADMIN_API_KEY:-dev-admin-key}
      VOICE_SERVICE_API_KEY: ${VOICE_SERVICE_API_KEY:-dev-voice-service-key}
      WHATSAPP_SERVICE_API_KEY: ${WHATSAPP_SERVICE_API_KEY:-dev-whatsapp-service-key}
      WHATSAPP_OWNER_SECRET: ${WHATSAPP_OWNER_SECRET:-dev-whatsapp-owner-secret}
      MEDIA_DIR: /app/uploads
      WHATSAPP_OUTREACH_ENABLED: ${WHATSAPP_OUTREACH_ENABLED:-false}
      WHATSAPP_TEST_RECIPIENTS: ${WHATSAPP_TEST_RECIPIENTS:-}
      CLINIC_PHONE: ${CLINIC_PHONE:-}
      RECEPTION_HOURS: ${RECEPTION_HOURS:-Contact the clinic for reception hours.}
      RECEPTION_RESPONSE: ${RECEPTION_RESPONSE:-Reception will reply during opening hours.}
    volumes:
      - media_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  whatsapp:
    profiles: ["whatsapp"]
    build: ./whatsapp-bot
    env_file: ./whatsapp-bot/.env
    environment:
      NODE_ENV: development
      WA_ENV: development
      WA_MODE: backend
      WA_CLINIC_READY: "false"
      WA_LIVE_NUMBER_CONFIRMED: "false"
      WA_BIND_HOST: 0.0.0.0
      WA_LOCAL_PORT: "8787"
      BACKEND_URL: http://api:8000
      BACKEND_WHATSAPP_SERVICE_KEY: ${WHATSAPP_SERVICE_API_KEY:-dev-whatsapp-service-key}
    command: ["node", "server.mjs"]
    ports:
      - "127.0.0.1:8787:8787"
    depends_on:
      api:
        condition: service_healthy
    stop_grace_period: 50s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: avocado
      POSTGRES_USER: avocado
      POSTGRES_PASSWORD: avocado
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avocado -d avocado"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres_data:
  media_uploads:
