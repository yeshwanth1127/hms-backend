name: avocado-health
services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://avocado:avocado@postgres:5432/avocado
      REDIS_URL: redis://redis:6379/0
      ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:5567,http://127.0.0.1:5567
      ADMIN_API_KEY: ${ADMIN_API_KEY:-dev-admin-key}
      VOICE_SERVICE_API_KEY: ${VOICE_SERVICE_API_KEY:-dev-voice-service-key}
      WHATSAPP_SERVICE_API_KEY: ${WHATSAPP_SERVICE_API_KEY:-dev-whatsapp-service-key}
      WHATSAPP_OWNER_SECRET: ${WHATSAPP_OWNER_SECRET:-dev-whatsapp-owner-secret}
      MEDIA_DIR: /app/uploads
      SESSION_COOKIE_NAME: exora_session
      SESSION_HOURS: 12
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@example.com}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-change-me-in-production}
      JITSI_DOMAIN: ${JITSI_DOMAIN:-meet.exora.local}
      JITSI_APP_ID: ${JITSI_APP_ID:-exora-hms}
      JITSI_ISSUER: ${JITSI_ISSUER:-exora-hms}
      JITSI_SECRET: ${JITSI_SECRET:-dev-jitsi-secret-change-me}
      JITSI_TOKEN_MINUTES: 5
      TELECONSULTATION_CONSENT_VERSION: ${TELECONSULTATION_CONSENT_VERSION:-2026-10-02}
      DEFAULT_HOSPITAL_SLUG: ${DEFAULT_HOSPITAL_SLUG:-exora-demo}
    volumes:
      - media_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: avocado
      POSTGRES_USER: avocado
      POSTGRES_PASSWORD: avocado
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avocado -d avocado"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres_data:
  media_uploads:
